name: FraudShield CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Lint, Test & Coverage
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff Linting
        run: |
          python -m ruff check .

      - name: Generate synthetic benchmark dataset
        run: |
          python scripts/generate_synthetic_data.py

      - name: Train baseline model artifact
        run: |
          python scripts/train_model.py --algorithm logistic_regression

      - name: Run Pytest Suite with Coverage
        run: |
          python -m pytest --cov=app --cov=database --cov=services --cov=ml --cov=routes --cov=config --cov-report=term-missing
