[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fraudshield"
version = "1.0.0"
description = "Machine Learning-Based Transaction Fraud Detection Platform"
authors = [{name = "FraudShield Contributors"}]
license = {text = "Proprietary"}
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.1.0",
    "Flask-SQLAlchemy>=3.1.1",
    "Flask-Login>=0.6.3",
    "Flask-WTF>=1.3.0",
    "WTForms>=3.2.2",
    "scikit-learn>=1.5.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "joblib>=1.4.0",
    "python-dotenv>=1.0.1",
    "email-validator>=2.1.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"

[tool.coverage.run]
source = ["app", "database", "services", "ml", "routes", "config"]
omit = [
    "tests/*",
    "*/__pycache__/*",
    "scripts/*",
    "benchmarks/*"
]

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]
